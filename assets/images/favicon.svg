<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <defs>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0070F3" />
    </linearGradient>
  </defs>

  <!-- Dark base chassis with chamfered brutalist edges -->
  <path d="M 14 4 L 50 4 L 60 14 L 60 50 L 50 60 L 14 60 L 4 50 L 4 14 Z" 
        fill="#070a0f" 
        stroke="#1e2d42" 
        stroke-width="2" />

  <!-- Corner tech accents -->
  <line x1="4" y1="14" x2="12" y2="14" stroke="#00E5FF" stroke-width="2" />
  <line x1="14" y1="4" x2="14" y2="12" stroke="#00E5FF" stroke-width="2" />
  <line x1="60" y1="50" x2="52" y2="50" stroke="#00E5FF" stroke-width="2" />
  <line x1="50" y1="60" x2="50" y2="52" stroke="#00E5FF" stroke-width="2" />

  <!-- Stylized 'A' Chevron -->
  <path d="M 32 12 L 48 44 L 40 44 L 32 26 L 24 44 L 16 44 Z" 
        fill="#FFFFFF" />

  <!-- Inner 'A' beam in cyan -->
  <polygon points="26,35 38,35 36,39 28,39" fill="#00E5FF" />

  <!-- Stylized 'L' foundation in glowing cyan -->
  <path d="M 17 47 L 51 47 L 53 52 L 17 52 Z" 
        fill="url(#fav-cyan)" 
        filter="url(#fav-glow)" />

  <!-- Center core node -->
  <rect x="30" y="29" width="4" height="4" fill="#00E5FF" />
</svg>

