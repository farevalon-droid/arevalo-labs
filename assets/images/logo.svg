<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="320" height="64">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear gradient for accent beams -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0070F3" />
    </linearGradient>
    
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0D7DE" />
    </linearGradient>
  </defs>

  <!-- ================= ICON EMBLEM (0 to 64) ================= -->
  <g transform="translate(6, 6)">
    <!-- Outer chamfered brutalist chassis / bracket -->
    <path d="M 12 2 L 40 2 L 50 12 L 50 40 L 40 50 L 12 50 L 2 40 L 2 12 Z" 
          fill="#070a0f" 
          stroke="#1e2d42" 
          stroke-width="1.5" />
          
    <!-- Corner tech ticks -->
    <line x1="2" y1="12" x2="8" y2="12" stroke="#00E5FF" stroke-width="1.5" opacity="0.8" />
    <line x1="12" y1="2" x2="12" y2="8" stroke="#00E5FF" stroke-width="1.5" opacity="0.8" />
    <line x1="50" y1="40" x2="44" y2="40" stroke="#00E5FF" stroke-width="1.5" opacity="0.8" />
    <line x1="40" y1="50" x2="40" y2="44" stroke="#00E5FF" stroke-width="1.5" opacity="0.8" />

    <!-- Isometric stylized 'A' & 'L' glyph -->
    <!-- The 'A' chevron peak -->
    <path d="M 26 10 L 39 36 L 33 36 L 26 21 L 19 36 L 13 36 Z" 
          fill="url(#white-grad)" />
          
    <!-- The 'A' inner crosshair beam -->
    <polygon points="21,29 31,29 29.5,32 22.5,32" fill="#00E5FF" />
    
    <!-- The 'L' structural foundation & energy relay -->
    <path d="M 14 38 L 42 38 L 44 42 L 14 42 Z" 
          fill="url(#cyan-grad)" 
          filter="url(#cyan-glow)" />

    <!-- Center active quantum node -->
    <rect x="24" y="24" width="4" height="4" fill="#00E5FF" />
    
    <!-- Micro telemetry dots -->
    <circle cx="8" cy="8" r="1.2" fill="#00E5FF" opacity="0.9" />
    <circle cx="44" cy="44" r="1.2" fill="#00E5FF" opacity="0.9" />
  </g>

  <!-- ================= TYPOGRAPHY & LOGOTYPE ================= -->
  <!-- Brand name "AREVALO" -->
  <text x="74" y="31" 
        font-family="'Space Grotesk', -apple-system, sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="0.08em" 
        fill="#FFFFFF">AREVALO</text>

  <!-- Brand name "LABS" in cyan -->
  <text x="186" y="31" 
        font-family="'Space Grotesk', -apple-system, sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="0.08em" 
        fill="#00E5FF">LABS</text>
        
  <!-- Registered mark -->
  <text x="247" y="20" 
        font-family="'JetBrains Mono', monospace" 
        font-size="9" 
        font-weight="600" 
        fill="#00E5FF">®</text>

  <!-- Subtitle descriptor / Lab credential -->
  <text x="75" y="47" 
        font-family="'JetBrains Mono', monospace" 
        font-size="8.5" 
        font-weight="500" 
        letter-spacing="0.14em" 
        fill="#9fb3c8">SOFTWARE ENGINEERING LAB</text>
        
  <!-- Trailing status indicator pill -->
  <rect x="276" y="23" width="5" height="5" fill="#00E5FF" opacity="0.8" />
  <text x="286" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#486581" font-weight="600">v5.0</text>
</svg>